{% extends 'layout/base.html' %}

{% block title %}
  Tạo Tài Khoản Mới
{% endblock %}

{% block style %}
<style>
  /* CSS giữ nguyên như của bạn để có nền đẹp */
  body { margin: 0; padding: 0; }

  .bg-registration {
    background-image: url("{{ url_for('static', filename='images/home.jpg') }}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
    width: 100vw;
    position: relative;
    left: 50%;
    right: 50%;
    margin-left: -50vw;
    margin-right: -50vw;
    display: flex;
    align-items: center;
  }

  .card-registration {
    background: rgba(255, 255, 255, 0.9) !important; /* Tăng độ mờ lên chút cho dễ đọc */
    backdrop-filter: blur(10px);
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
</style>
{% endblock %}

{% block content %}
<section class="bg-registration">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8 col-xl-6">
        <div class="card shadow card-registration">
          <div class="card-body p-4 p-md-5">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="mb-0">Tạo Tài Khoản</h3>
                <a href="/admin" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-arrow-left"></i> Quay lại
                </a>
            </div>

            {% if err_msg %}
              <div class="alert alert-danger text-center">
                  <i class="fas fa-exclamation-circle"></i> {{ err_msg }}
              </div>
            {% endif %}

            <form method="POST" action="{{ url_for('admin_create_account') }}">

              <div class="mb-4">
                <label class="form-label fw-bold" for="hoTen">Họ và tên</label>
                <input type="text" id="hoTen" name="ho_ten" class="form-control form-control-lg" placeholder="Ví dụ: Nguyễn Văn A" required />
              </div>

              <div class="mb-4">
                <label class="form-label fw-bold" for="taiKhoan">Tên đăng nhập</label>
                <input type="text" id="taiKhoan" name="tai_khoan" class="form-control form-control-lg" placeholder="Nhập username..." required />
              </div>

              <div class="mb-4">
                <label class="form-label fw-bold" for="matKhau">Mật khẩu</label>
                <input type="password" id="matKhau" name="mat_khau" class="form-control form-control-lg" placeholder="Nhập mật khẩu..." required />
              </div>

              <div class="mb-4">
                <label class="form-label fw-bold">Phân quyền</label>
                <select class="form-control form-select form-control-lg" name="role_id" required>
                  <option value="" disabled selected>-- Chọn vai trò --</option>

                  {# Vòng lặp này sẽ tự động nhận danh sách đã lọc từ Backend #}
                  {% for r in roles %}
                    <option value="{{ r.id }}">{{ r.role_name }}</option>
                  {% endfor %}

                </select>
                <small class="text-muted fst-italic mt-2 d-block">
                    * Danh sách quyền hạn hiển thị dựa trên cấp bậc hiện tại của bạn.
                </small>
              </div>

              <div class="d-grid gap-2 mt-5">
                <button class="btn btn-primary btn-lg" type="submit">
                    <i class="fas fa-user-plus"></i> Xác nhận tạo mới
                </button>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
