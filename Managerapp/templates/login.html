{% extends 'layout/base.html' %}

{% block title %} Đăng nhập hệ thống {% endblock %}

{% block style %}
<style>
  /* CSS để phá vỡ khung container của base.html và tràn full màn hình */
  body { margin: 0; padding: 0; }

  .bg-login {
    background-image: url("{{ url_for('static', filename='images/home.jpg') }}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;

    /* Kỹ thuật phá khung container cha */
    width: 100vw;
    position: relative;
    left: 50%;
    right: 50%;
    margin-left: -50vw;
    margin-right: -50vw;

    display: flex;
    align-items: center;
  }

  /* Hiệu ứng kính mờ cho khung đăng nhập */
  .card-login {
    background: rgba(255, 255, 255, 0.9) !important;
    backdrop-filter: blur(10px);
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
</style>
{% endblock %}

{% block content %}
<section class="bg-login">
    <div class="container py-5">
        <div class="row justify-content-center align-items-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">

                <div class="card shadow card-login">
                    <div class="card-body p-5 text-center">

                        <div class="mb-4">
                            <i class="fas fa-user-circle fa-3x text-primary"></i>
                        </div>
                        <h3 class="mb-4">Đăng Nhập</h3>

                        {% if err_msg %}
                        <div class="alert alert-danger mb-4 d-flex align-items-center" role="alert">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            <div>{{ err_msg }}</div>
                        </div>
                        {% endif %}

                        <form action="{{ url_for('login_user_view') }}" method="post">

                            <div class="form-floating mb-4 text-start">
                                <input type="text" name="tai_khoan" id="taiKhoanInput" class="form-control" placeholder="Tên đăng nhập" required />
                                <label for="taiKhoanInput">Tài khoản</label>
                            </div>

                            <div class="form-floating mb-4 text-start">
                                <input type="password" name="mat_khau" id="matKhauInput" class="form-control" placeholder="Mật khẩu" required />
                                <label for="matKhauInput">Mật khẩu</label>
                            </div>

                            <button class="btn btn-primary btn-lg btn-block w-100 mb-3" type="submit">
                                <i class="fas fa-sign-in-alt me-2"></i> Đăng nhập
                            </button>

                            <hr class="my-4">

                            <div class="d-flex justify-content-center">
                                <a href="/" class="text-secondary text-decoration-none">
                                    <i class="fas fa-home"></i> Trở về trang chủ
                                </a>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
