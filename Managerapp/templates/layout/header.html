<nav class="navbar bg-body-tertiary shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">

        <a class="navbar-brand" href="{{ url_for('index') }}">
            <img
                    src="{{ url_for('static',filename='images/logo.jpg') }}"
                    height="40"
                    alt="Logo"
                    loading="lazy"
            />
        </a>

        <div class="d-flex align-items-center">

            {% if current_user.is_authenticated %}

                <span class="me-3 text-secondary d-none d-md-block">
                    Xin chào, <strong>{{ current_user.ho_ten }}</strong>
                    <small class="badge bg-light text-dark border">{{ current_user.user_role }}</small>
                </span>

                {% if current_user.user_role == 'Admin' or current_user.user_role == 'QuanLy' %}
                    <a href="/admin" class="btn btn-outline-warning btn-sm me-2" title="Vào trang quản trị">
                        <i class="fas fa-cogs"></i> <span class="d-none d-sm-inline">Admin</span>
                    </a>
                {% endif %}

                <a href="{{ url_for('logout_process') }}" class="btn btn-outline-danger btn-sm">
                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                </a>

            {% else %}
                <a href="{{ url_for('login_user_view') }}" class="btn btn-primary btn-sm">
                    <i class="fas fa-user"></i> Đăng nhập
                </a>

            {% endif %}

        </div>

    </div>
</nav>
